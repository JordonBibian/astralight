name: CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Astralight
            sdk: iphonesimulator
            platform: iOS

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Apply pinned dependency fixes
        run: sh BuildScripts/apply-dependency-fixes.sh

      - name: Verify release inputs and privacy logging
        run: |
          python3 BuildScripts/verify-release-inputs.py
          sh Tests/run-privacy-tests.sh

      - name: Download ${{ matrix.platform }} platform
        run: xcodebuild -downloadPlatform ${{ matrix.platform }}

      - name: Build Debug
        run: xcodebuild -project Astralight.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug -sdk ${{ matrix.sdk }} clean build

      - name: Build Release
        run: xcodebuild -project Astralight.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Release -sdk ${{ matrix.sdk }} clean build
